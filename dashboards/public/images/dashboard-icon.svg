<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background — matches ERPNext/CRM launcher style -->
  <rect width="100" height="100" rx="22" fill="#1565C0"/>
  <!-- Bar chart: 3 bars growing left to right -->
  <rect x="13" y="58" width="18" height="28" rx="3" fill="white" opacity="0.95"/>
  <rect x="41" y="38" width="18" height="48" rx="3" fill="white" opacity="0.95"/>
  <rect x="69" y="22" width="18" height="64" rx="3" fill="white" opacity="0.95"/>
  <!-- Trend line over the bars -->
  <polyline
    points="22,52 50,32 78,18"
    fill="none"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
  />
  <!-- Dot at each data point -->
  <circle cx="22" cy="52" r="3.5" fill="white" opacity="0.8"/>
  <circle cx="50" cy="32" r="3.5" fill="white" opacity="0.8"/>
  <circle cx="78" cy="18" r="3.5" fill="white" opacity="0.8"/>
</svg>
